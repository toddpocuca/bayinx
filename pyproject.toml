[project]
name = "bayinx"
version = "0.6.2"
description = "Bayesian Inference with JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax >= 0.8.0",
    "diffrax>=0.7.0",
    "equinox>=0.13.2",
    "jaxtyping>=0.2.36",
    "optax>=0.2.4",
    "tqdm>=4.67.1",
]
authors = [{ name = "Todd Pocuca" }]
maintainers = [{ name = "Todd Pocuca" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayinx"]

[tool.pytest.ini_options]
addopts = "-q --benchmark-min-rounds=30 --benchmark-columns=rounds,mean,median,stddev --benchmark-group-by=func"

[dependency-groups]
cuda = [
    "jax[cuda]>=0.8.0",
]
dev = [
    "cairocffi>=1.7.1",
    "lets-plot>=4.8.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "plotnine>=0.15.2",
    "polars>=1.36.1",
    "pyarrow>=22.0.0",
    "pymdown-extensions>=10.18",
    "pytest>=8.3.5",
    "pytest-benchmark>=5.1.0",
]

[tool.ruff.lint]
ignore = ["F811"]
extend-ignore = ["F722"]
